name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --name PSLTracker --add-data "index.html;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PSLTracker-windows
          path: dist/PSLTracker.exe
